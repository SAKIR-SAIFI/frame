services:
  - type: web
    name: frame
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_DB_NAME
        value: frame
      - key: MONGODB_MAX_POOL_SIZE
        value: "5"
      - key: COOKIE_SECURE
        value: "true"
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
